<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Chat</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242736;
      --border: #2e3140;
      --text: #e4e6ef;
      --text-dim: #8b8fa3;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --green: #00b894;
      --green-bg: rgba(0,184,148,.12);
      --red: #e17055;
      --user-bg: #6c5ce7;
      --bot-bg: #242736;
      --radius: 12px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 span { font-size: 24px; }
    .status-badge {
      font-size: 13px;
      color: var(--text-dim);
      background: var(--surface2);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .status-badge strong { color: var(--accent-light); }

    /* ── Main layout ──────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────────────────────── */
    .sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
    }
    .sidebar h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Upload area */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      position: relative;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(108,92,231,.08);
    }
    .upload-zone input { display: none; }
    .upload-zone .icon { font-size: 36px; margin-bottom: 10px; }
    .upload-zone p { font-size: 14px; color: var(--text-dim); }
    .upload-zone p strong { color: var(--accent-light); }

    /* Strategy toggle */
    .strategy {
      display: flex;
      gap: 8px;
    }
    .strategy button {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      font-family: var(--font);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface2);
      color: var(--text-dim);
      cursor: pointer;
      transition: all .2s;
    }
    .strategy button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* File list */
    .file-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .file-item {
      font-size: 13px;
      padding: 10px 12px;
      background: var(--surface2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .file-item .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
    }

    /* Upload progress */
    .upload-progress {
      display: none;
      padding: 12px;
      background: var(--surface2);
      border-radius: 8px;
      font-size: 13px;
    }
    .upload-progress.show { display: block; }
    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-bar .fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width .3s;
    }

    /* ── Chat area ────────────────────────────────────────────── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg {
      max-width: 75%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeIn .25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; }
    .msg.bot  { align-self: flex-start; }

    .msg .bubble {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg .meta {
      font-size: 11px;
      color: var(--text-dim);
      padding: 0 4px;
    }

    /* Result cards inside bot messages */
    .result-card {
      margin-top: 10px;
      padding: 12px 14px;
      background: rgba(108,92,231,.08);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      font-size: 13px;
      line-height: 1.5;
    }
    .result-card .rank {
      font-weight: 700;
      color: var(--accent-light);
      margin-right: 6px;
    }
    .result-card .distance {
      color: var(--text-dim);
      font-size: 12px;
      float: right;
    }
    .result-card .breadcrumb {
      font-size: 11px;
      color: var(--green);
      margin-top: 4px;
    }
    .result-card .snippet {
      margin-top: 6px;
      color: var(--text);
    }

    /* Welcome screen */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-dim);
    }
    .welcome .big-icon { font-size: 48px; }
    .welcome h2 { font-size: 22px; color: var(--text); font-weight: 600; }
    .welcome p { font-size: 14px; max-width: 400px; text-align: center; line-height: 1.6; }

    /* ── Input bar ────────────────────────────────────────────── */
    .input-bar {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .input-bar input {
      flex: 1;
      padding: 14px 18px;
      font-size: 14px;
      font-family: var(--font);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .input-bar input:focus { border-color: var(--accent); }
    .input-bar input::placeholder { color: var(--text-dim); }

    .input-bar select {
      padding: 14px 12px;
      font-size: 13px;
      font-family: var(--font);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    .send-btn {
      padding: 14px 20px;
      font-size: 14px;
      font-family: var(--font);
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background .2s;
      white-space: nowrap;
    }
    .send-btn:hover { background: #5a4bd4; }
    .send-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1><span>📚</span> RAG Chat</h1>
    <div class="status-badge">Chunks: <strong id="chunkCount">0</strong></div>
  </div>

  <div class="main">

    <!-- Sidebar -->
    <div class="sidebar">
      <h2>Upload Document</h2>

      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".pdf" />
        <div class="icon">📄</div>
        <p>Drag & drop a <strong>PDF</strong> here<br/>or click to browse</p>
      </div>

      <div class="strategy">
        <button class="active" data-val="tokens">Token chunks</button>
        <button data-val="headings">Heading chunks</button>
      </div>

      <div class="upload-progress" id="uploadProgress">
        <span id="uploadText">Uploading…</span>
        <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
      </div>

      <h2 style="margin-top: 8px;">Ingested Files</h2>
      <div class="file-list" id="fileList"></div>
    </div>

    <!-- Chat -->
    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="welcome">
          <div class="big-icon">💬</div>
          <h2>Ask your documents anything</h2>
          <p>Upload a PDF on the left, then type a question below. The system will find the most relevant passages using semantic search.</p>
        </div>
      </div>

      <div class="input-bar">
        <input type="text" id="queryInput" placeholder="Ask a question about your documents…" autocomplete="off" />
        <select id="topK">
          <option value="3">Top 3</option>
          <option value="5" selected>Top 5</option>
          <option value="10">Top 10</option>
        </select>
        <button class="send-btn" id="sendBtn">Send ➜</button>
      </div>
    </div>

  </div>

<script>
  // ── State ──────────────────────────────────────────────────────
  let strategy = 'tokens';
  const messagesEl = document.getElementById('messages');
  let welcomeRemoved = false;

  // ── Status polling ─────────────────────────────────────────────
  async function refreshStatus() {
    try {
      const r = await fetch('/status');
      const d = await r.json();
      document.getElementById('chunkCount').textContent = d.total_chunks;
    } catch {}
  }
  refreshStatus();

  // ── Strategy toggle ────────────────────────────────────────────
  document.querySelectorAll('.strategy button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.strategy button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      strategy = btn.dataset.val;
    });
  });

  // ── Upload ─────────────────────────────────────────────────────
  const uploadZone = document.getElementById('uploadZone');
  const fileInput  = document.getElementById('fileInput');
  const uploadProg = document.getElementById('uploadProgress');
  const uploadText = document.getElementById('uploadText');
  const progressFill = document.getElementById('progressFill');
  const fileList   = document.getElementById('fileList');

  uploadZone.addEventListener('click', () => fileInput.click());
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => { if (fileInput.files.length) uploadFile(fileInput.files[0]); });

  async function uploadFile(file) {
    if (!file.name.toLowerCase().endsWith('.pdf')) {
      alert('Please upload a PDF file.');
      return;
    }

    uploadProg.classList.add('show');
    uploadText.textContent = `Uploading "${file.name}"…`;
    progressFill.style.width = '30%';

    const fd = new FormData();
    fd.append('file', file);
    fd.append('strategy', strategy);

    try {
      progressFill.style.width = '60%';
      const r = await fetch('/upload', { method: 'POST', body: fd });
      const d = await r.json();
      progressFill.style.width = '100%';

      if (r.ok) {
        uploadText.textContent = `✅ ${d.message}`;
        fileList.insertAdjacentHTML('beforeend',
          `<div class="file-item"><div class="dot"></div>${file.name} — ${d.chunks} chunks</div>`);
        refreshStatus();
      } else {
        uploadText.textContent = `❌ ${d.error}`;
      }
    } catch (err) {
      uploadText.textContent = `❌ Network error.`;
    }

    setTimeout(() => { uploadProg.classList.remove('show'); progressFill.style.width = '0%'; }, 3000);
    fileInput.value = '';
  }

  // ── Chat ───────────────────────────────────────────────────────
  const queryInput = document.getElementById('queryInput');
  const sendBtn    = document.getElementById('sendBtn');

  function removeWelcome() {
    if (!welcomeRemoved) {
      const w = messagesEl.querySelector('.welcome');
      if (w) w.remove();
      welcomeRemoved = true;
    }
  }

  function addMessage(role, html) {
    removeWelcome();
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    div.innerHTML = `<div class="bubble">${html}</div><div class="meta">${role === 'user' ? 'You' : 'RAG'} · ${now}</div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendQuery() {
    const q = queryInput.value.trim();
    if (!q) return;

    addMessage('user', escapeHtml(q));
    queryInput.value = '';
    sendBtn.disabled = true;

    try {
      const r = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q, top_k: parseInt(document.getElementById('topK').value) }),
      });
      const d = await r.json();

      if (!r.ok) {
        addMessage('bot', `⚠️ ${escapeHtml(d.error)}`);
      } else if (d.results.length === 0) {
        addMessage('bot', 'No matching results found.');
      } else {
        let html = `<strong>Found ${d.results.length} relevant passages:</strong>`;
        d.results.forEach((hit, i) => {
          const meta = Object.entries(hit.metadata || {})
            .filter(([k]) => k !== 'source')
            .map(([k,v]) => `${k}: ${v}`).join(' › ');
          const source = hit.metadata?.source || '';
          html += `
            <div class="result-card">
              <span class="rank">#${i+1}</span>
              <span class="distance">distance: ${hit.distance.toFixed(4)}</span>
              ${meta ? `<div class="breadcrumb">📂 ${escapeHtml(meta)}</div>` : ''}
              ${source ? `<div class="breadcrumb">📄 ${escapeHtml(source)}</div>` : ''}
              <div class="snippet">${escapeHtml(hit.document.substring(0, 300))}${hit.document.length > 300 ? '…' : ''}</div>
            </div>`;
        });
        addMessage('bot', html);
      }
    } catch {
      addMessage('bot', '❌ Network error. Is the server running?');
    }

    sendBtn.disabled = false;
    queryInput.focus();
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  sendBtn.addEventListener('click', sendQuery);
  queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendQuery(); });
</script>

</body>
</html>
